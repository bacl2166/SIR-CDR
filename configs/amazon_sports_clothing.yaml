dataset:
  source_domain: Sports_and_Outdoors
  target_domain: Clothing_Shoes_and_Jewelry
  raw_dir: data/raw/amazon2014
  processed_dir: data/processed/sports_to_clothing
  min_interactions_per_domain: 5
  max_text_chars: 12000
  seed: 42

embedding:
  provider: qwen
  model: text-embedding-v4
  dimension: 768
  batch_size: 10
  max_retries: 5
  retry_initial_seconds: 2.0
  input_path: data/processed/sports_to_clothing/item_texts.jsonl
  output_dir: artifacts/embeddings/sports_to_clothing
  api_key_env: DASHSCOPE_API_KEY
  base_url_env: DASHSCOPE_BASE_URL

tokenizer:
  embeddings_path: artifacts/embeddings/sports_to_clothing/text_embeddings.pt
  item_texts_path: data/processed/sports_to_clothing/item_texts.jsonl
  output_dir: artifacts/tokenizer/sports_to_clothing
  input_dim: 768
  hidden_dim: 128
  codebook_size: 512
  token_length: 4
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.00001
  max_epochs: 100
  domain_loss_weight: 0.1
  gate_balance_weight: 0.01
  kmeans_iterations: 20
  max_collision_rate: 0.10
  min_level_utilization: 0.10
  seed: 42

recommendation:
  processed_dir: data/processed/sports_to_clothing
  tokenizer_dir: artifacts/tokenizer/sports_to_clothing
  output_dir: artifacts/recommendation/sports_to_clothing
  hidden_dim: 128
  reasoning_steps: 3
  prefix_length: 4
  max_sequence_length: 50
  batch_size: 256
  evaluation_batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.00001
  max_epochs: 100
  evaluation_every: 5
  patience: 5
  retrieval_temperature: 0.1
  top_ks: [5, 10, 20]
  candidate_chunk_size: 2048
  rerank_candidates: 200
  seed: 42
