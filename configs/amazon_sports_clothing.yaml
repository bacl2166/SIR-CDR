dataset:
  source_domain: Sports_and_Outdoors
  target_domain: Clothing_Shoes_and_Jewelry
  raw_dir: data/raw/amazon2014
  processed_dir: data/processed/sports_to_clothing
  min_interactions_per_domain: 5
  max_text_chars: 12000
  seed: 42

embedding:
  provider: qwen
  model: text-embedding-v4
  dimension: 768
  batch_size: 10
  max_retries: 5
  retry_initial_seconds: 2.0
  input_path: data/processed/sports_to_clothing/item_texts.jsonl
  output_dir: artifacts/embeddings/sports_to_clothing
  api_key_env: DASHSCOPE_API_KEY
  base_url_env: DASHSCOPE_BASE_URL
