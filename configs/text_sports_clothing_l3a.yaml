text_recommendation:
  processed_dir: data/processed/sports_to_clothing
  tokenizer_dir: artifacts/tokenizer/qwen3_8b/sports_to_clothing
  output_dir: artifacts/text_cdr_v3_l3a/qwen3_8b/sports_to_clothing
  hidden_dim: 128
  reasoning_steps: 3
  feedback_steps: 2
  prefix_length: 4
  graph_layers: 2
  cross_window: 5
  max_sequence_length: 50
  batch_size: 128
  evaluation_batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.0001
  dropout: 0.1
  max_epochs: 100
  evaluation_every: 2
  patience: 8
  scheduler_patience: 2
  selection_metric: NDCG@10
  retrieval_temperature: 0.1
  top_ks: [5, 10, 20]
  inference_mode: hybrid
  rerank_candidates: 500
  generation_weight: 1.0
  retrieval_weight: 1.0
  label_smoothing: 0.1
  decode_chunk_size: 256
  beam_size: 50
  cpf_weight: 0.1
  alignment_weight: 0.02
  separation_weight: 0.01
  graph_enabled: true
  reasoning_enabled: true
  semantic_enabled: true
  source_enabled: true
  prototype_enabled: true
  cd_injector_enabled: true
  sp_injector_enabled: true
  codebook_summary_enabled: true
  contrastive_alignment: true
  lsep_weight: 0.01
  proto_orth_weight: 0.01
  seed: 42
